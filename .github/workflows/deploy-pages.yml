name: Publiser nettsted

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent nettstedet
        uses: actions/checkout@v6

      - name: Konfigurer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Kontroller koden
        run: npm run lint

      - name: Bygg nettstedet
        run: npm run build

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Klargjor nettstedfilene
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v4
